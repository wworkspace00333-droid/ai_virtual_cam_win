# Windows installer build: manual run (Actions tab -> installer-windows -> Run workflow) and version tags (v*).
# ~30-40 min, so it does not run on every push. Produces AIVirtualCameraStudio-Setup-<version>.exe + .sha256 as an
# artifact, plus the licence report and the frozen app's self-check.
#
# Signing (optional; scripts/sign_win.ps1): repository secrets VCS_SIGN_PFX_BASE64 (the .pfx, base64) and
# VCS_SIGN_PFX_PASSWORD. With them, a tag build requires a signature (VCS_SIGN_REQUIRED=1); without them it is unsigned.
# Hardware tokens / Azure Trusted Signing need a self-hosted runner or extra setup (see sign_win.ps1).
name: installer-windows

#
# Release: on a tag (or a manual run with "tag" filled in) the installer and its .sha256 are attached to that tag's
# GitHub Release, with the workflow's own GITHUB_TOKEN. If the release does not exist yet it is created as a DRAFT
# pre-release with the tag's CHANGELOG section; the owner reviews and publishes it. Nothing else is published.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to its release (e.g. v0.4.1); empty = build only"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write          # attach files to the release of the tag (and create it as a draft if missing)

jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      VCS_BUILD: C:\vcs-build          # short path: PySide6 paths exceed MAX_PATH under a deep folder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python venv at a short path
        shell: pwsh
        run: |
          python -m venv C:\vcs-env
          C:\vcs-env\Scripts\python -m pip install -r requirements-dev-windows.txt

      - name: Inno Setup and OBS Studio (for the plugin's import libraries)
        run: choco install innosetup obs-studio -y --no-progress

      - name: OBS headers of the installed OBS version
        shell: pwsh
        run: |
          $v = (Get-Item "C:\Program Files\obs-studio\bin\64bit\obs64.exe").VersionInfo.ProductVersion.Trim()
          $v = ($v -split '[^0-9.]')[0]
          Write-Host "OBS $v"
          git clone --depth 1 --branch $v https://github.com/obsproject/obs-studio C:\obs-src

      - name: Built-in models (SHA-256 checked)
        run: C:\vcs-env\Scripts\python scripts\fetch_models.py

      - name: Work folder
        run: New-Item -ItemType Directory -Force $env:VCS_BUILD | Out-Null    # older tags' scripts do not create it

      - name: PyAV against LGPL-only FFmpeg (no x264 / x265)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_pyav_lgpl_win.ps1 -Python C:\vcs-env\Scripts\python.exe -Work $env:VCS_BUILD

      - name: Signing certificate from secrets (if configured)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.VCS_SIGN_PFX_BASE64 }}
        run: |
          if ($env:PFX_B64) {
            $p = Join-Path $env:RUNNER_TEMP "sign.pfx"
            [IO.File]::WriteAllBytes($p, [Convert]::FromBase64String($env:PFX_B64))
            "VCS_SIGN_PFX=$p" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            if ("${{ github.ref_type }}" -eq "tag") { "VCS_SIGN_REQUIRED=1" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }
          } else { Write-Host "no signing certificate configured: unsigned build" }

      - name: Build the installer (native parts, plugin, licence gate, PyInstaller, self-check, Inno Setup)
        env:
          VCS_SIGN_PFX_PASSWORD: ${{ secrets.VCS_SIGN_PFX_PASSWORD }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_installer_win.ps1 -Python C:\vcs-env\Scripts\python.exe -Out $env:VCS_BUILD -ObsHeaders C:\obs-src

      - name: Remove the certificate file
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP "sign.pfx") -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            C:\vcs-build\AIVirtualCameraStudio-Setup-*.exe
            C:\vcs-build\AIVirtualCameraStudio-Setup-*.exe.sha256
            build\licences.json
            build\selfcheck.json
          retention-days: 30

      - name: Attach the installer to the tag's release (draft pre-release if it does not exist)
        if: github.ref_type == 'tag' || inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-Item "C:\vcs-build\AIVirtualCameraStudio-Setup-*.exe"
          $sha = Get-Item "$($exe.FullName).sha256"
          $ver = $env:TAG.TrimStart("v")
          if (-not $exe.Name.Contains("-$ver.exe")) { throw "tag $env:TAG does not match the built $($exe.Name)" }
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            # notes: this version's CHANGELOG section, the checksum and the install hint
            $log = Get-Content CHANGELOG.md -Encoding utf8
            $head = "## [$ver]"
            $start = [Array]::FindIndex($log, [Predicate[string]]{ param($l) $l.StartsWith($head) })
            $section = @()
            if ($start -ge 0) {
              for ($i = $start + 1; $i -lt $log.Count -and -not $log[$i].StartsWith("## ["); $i++) { $section += $log[$i] }
            }
            $hash = (Get-Content $sha.FullName).Split(" ")[0]
            $notes = @("**AI Virtual Camera Studio for Windows $ver (preview)**", "") + $section + @("",
              "### Install", "Download ``$($exe.Name)`` and check it in PowerShell:",
              "``Get-FileHash .\$($exe.Name) -Algorithm SHA256`` must equal ``$hash``.",
              "The installer is not code-signed yet: SmartScreen shows ""Windows protected your PC"" -> More info -> Run anyway.")
            $notes -join "`n" | Out-File -Encoding utf8 notes.md
            gh release create $env:TAG --repo $env:GITHUB_REPOSITORY --verify-tag --draft --prerelease `
              --title "$ver (preview)" --notes-file notes.md
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          }
          gh release upload $env:TAG $exe.FullName $sha.FullName --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json assets --jq ".assets[] | .name + ""  "" + (.size|tostring)"
